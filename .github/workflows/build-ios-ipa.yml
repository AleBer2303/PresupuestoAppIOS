name: Generar IPA para iPhone (Release)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ipa:
    name: Compilar .ipa en macOS (Sin requerir cuenta de $99)
    runs-on: macos-15
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Seleccionar la versión más reciente de Xcode disponible
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Seleccionando Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias NPM
        run: npm install --legacy-peer-deps

      - name: Ejecutar validación y pruebas funcionales
        run: npm run validate

      - name: Generar proyecto nativo iOS (Expo Prebuild sin instalar Pods aún)
        env:
          CI: '1'
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Configurar Podfile para desactivar firma en Pods y Resource Bundles
        working-directory: ios
        run: |
          node -e '
            const fs = require("fs");
            let podfile = fs.readFileSync("Podfile", "utf8");
            const signingSnippet = `
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
                  config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
                  config.build_settings["CODE_SIGN_IDENTITY"] = ""
                  config.build_settings["EXPANDED_CODE_SIGN_IDENTITY"] = ""
                end
              end
              installer.target_installation_results.pod_target_installation_results.each do |pod_name, target_installation_result|
                target_installation_result.resource_bundle_targets.each do |resource_bundle_target|
                  resource_bundle_target.build_configurations.each do |config|
                    config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
                    config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
                    config.build_settings["CODE_SIGN_IDENTITY"] = ""
                    config.build_settings["EXPANDED_CODE_SIGN_IDENTITY"] = ""
                  end
                end
              end
            `;
            podfile = podfile.replace(
              /post_install do \|installer\|/,
              "post_install do |installer|\n" + signingSnippet
            );
            fs.writeFileSync("Podfile", podfile, "utf8");
          '
          pod install

      - name: Compilar archivo .app en modo Release (Xcode)
        working-directory: ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "Compilando Workspace: $WORKSPACE | Scheme: $SCHEME"
          set -o pipefail
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build | tee xcodebuild.log || {
              echo "=== ERRORES DETECTADOS EN XCODEBUILD ==="
              grep -iE "error:|fatal error:|failed" xcodebuild.log | tail -n 50 || true
              exit 65
            }

      - name: Empaquetar en PresupuestoApp.ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "Empaquetando aplicación: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r9 ../PresupuestoApp.ipa Payload

      - name: Subir artefacto PresupuestoApp.ipa
        uses: actions/upload-artifact@v4
        with:
          name: PresupuestoApp-iOS-IPA
          path: PresupuestoApp.ipa
          retention-days: 30
